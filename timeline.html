    <h1>綜合大事年表</h1>
    <p class="lede"><strong>不分國家</strong>，依時代先後排序的東亞史總年表。每則事件標有相關國家，可用上方按鈕<strong>篩選國家</strong>、用搜尋框查<strong>事件、人物、條約名稱</strong>。想看單一國家的完整軌跡，請改用<a href="timeline-country.html">分國年表</a>。</p>
  </section>

  <div class="box note">
    <p class="box-t">這份年表怎麼用</p>
    <p><strong>橫著看</strong>（不篩選）——看出同一時期東亞各國<strong>同時</strong>發生了什麼。例如1868年日本明治維新時，中國正在推行自強運動、朝鮮大院君正在鎖國、越南已割讓南圻三省給法國。這種「共時性對照」是申論題最有力的素材。<br>
    <strong>直著看</strong>（篩選單一國家）——追蹤一個國家的長期發展軌跡。</p>
  </div>
